# Spec 009 (T1410): docker compose up -d --build
services:
  app:
    build: .
    image: cien-mexicanos:latest
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      # IP pública que va en los QR (AC-125)
      APP_LAN_ADDRESS: ${PUBLIC_IP:?Define PUBLIC_IP en .env}
      APP_FRONTEND_PORT: "80"
      # Origen permitido para REST y STOMP (AC-126)
      APP_PUBLIC_ORIGIN: http://${PUBLIC_IP}
    volumes:
      - ./data:/app/data
